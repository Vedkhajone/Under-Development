<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Under Development</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0f0f0f;
      color: #ffffff;
      font-family: 'Poppins', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }

    .container {
      text-align: center;
    }

    h1 {
      font-size: 3rem;
      color: #ffffff;
      animation: glow 1.5s ease-in-out infinite alternate;
      position: relative;
    }

    h1::after {
      content: '';
      display: block;
      width: 80%;
      height: 3px;
      background: linear-gradient(90deg, #ff416c, #ff4b2b);
      margin: 20px auto 0;
      border-radius: 5px;
      animation: slide 2s linear infinite;
    }

    @keyframes glow {
      from {
        text-shadow: 0 0 10px #ff416c, 0 0 20px #ff4b2b;
      }
      to {
        text-shadow: 0 0 20px #ff4b2b, 0 0 30px #ff416c;
      }
    }

    @keyframes slide {
      0% {
        transform: translateX(-20%);
      }
      100% {
        transform: translateX(20%);
      }
    }

    p {
      font-size: 1.2rem;
      margin-top: 20px;
      color: #bbbbbb;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚧 Currently Under Development 🚧</h1>
    <p>I am working hard to launch soon. Stay tuned!</p>
  </div>
</body>
</html>
